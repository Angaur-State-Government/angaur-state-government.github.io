<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Official website of Angaur State, Republic of Palau: heritage, places to see, governance and visitor information."><meta property="og:title" content="Angaur State Government"><meta property="og:description" content="Discover Angaur, Palau's southernmost island."><meta property="og:image" content="hero-sunset.webp"><link rel="icon" href="favicon.png"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Angaur State Government</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style id="site-css">
/* Layout: coastal government portal; dark sunset hero, then alternating limestone and lagoon bands, cards only where items repeat. */
:root{
  --bg:#F2F5F1; --surface:#FFFFFF; --band:#E4EDEA; --ink:#0E2235; --muted:#4E5F6B; --line:#CCD8D4;
  --lagoon:#0E7F88; --jungle:#2D6838; --kelau:#D9661A; --kelau-ink:#FFFFFF;
  --hero-a:#0B1B2B; --hero-ink:#F7F3EC; --hero-acc:#F7B57A;
  --display:"Gloock",Georgia,"Times New Roman",serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A141C; --surface:#11202B; --band:#0F1C26; --ink:#E5EDEF; --muted:#9BAEB8; --line:#22394A;
  --lagoon:#46BFC7; --jungle:#77B582; --kelau:#F08A3C; --kelau-ink:#1A0E05; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A141C; --surface:#11202B; --band:#0F1C26; --ink:#E5EDEF; --muted:#9BAEB8; --line:#22394A;
  --lagoon:#46BFC7; --jungle:#77B582; --kelau:#F08A3C; --kelau-ink:#1A0E05; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--hero-a)}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.1;text-wrap:balance;margin:0}
h2{font-size:calc(clamp(1.9rem,4vw,2.8rem) * var(--hs,1))}
h3{font-size:calc(1.3rem * var(--hs,1))}
p{margin:0}
.pre{white-space:pre-line}
.eyebrow{font:600 .75rem/1.2 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--lagoon)}
.lead{color:var(--muted);max-width:62ch}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.8rem 1.25rem;border-radius:999px;font:600 .95rem/1 var(--body);text-decoration:none;border:1px solid transparent;cursor:pointer;background:none}
.btn-primary{background:var(--kelau);color:var(--kelau-ink)}
.btn-ghost{border-color:var(--line);color:var(--ink)}
.btn:focus-visible,button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--lagoon);outline-offset:2px}
section{padding-block:clamp(56px,8vw,96px)}
.band{background:var(--band)}
.sec-head{display:grid;gap:.75rem;margin-bottom:2rem}
.more{margin-top:1.75rem;display:flex;gap:.75rem;flex-wrap:wrap}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hero-a);color:var(--hero-ink)}
.top .wrap{display:flex;align-items:center;gap:1rem;padding-block:.75rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.6rem;text-decoration:none;min-width:0}
.brand-mark{width:36px;height:36px;flex:none}
.brand-name{display:block;font-family:var(--display);font-size:1.15rem;line-height:1.1}
.brand-sub{display:block;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.nav{display:flex;gap:.2rem;margin-left:auto;overflow-x:auto;max-width:100%;scrollbar-width:none;align-items:center}
.nav::-webkit-scrollbar{display:none}
.nav a{padding:.45rem .7rem;border-radius:999px;font-size:.9rem;text-decoration:none;white-space:nowrap;opacity:.8}
.nav a:hover{opacity:1;background:rgba(255,255,255,.08)}
.nav a[aria-current="page"]{opacity:1;background:rgba(255,255,255,.12)}
.nav a.nav-cta{background:var(--kelau);color:var(--kelau-ink);opacity:1;font-weight:600}
@media (max-width:760px){.nav{margin-left:0;width:100%}}

/* hero */
.hero{position:relative;color:var(--hero-ink);background:var(--hero-a);overflow:hidden;min-height:clamp(600px,88vh,880px);display:flex;align-items:flex-end;padding-block:clamp(96px,14vw,160px) clamp(28px,4vw,48px)}
.hero-scene{position:absolute;inset:0;width:100%;height:100%}
.hero-photo{position:absolute;inset:0;overflow:hidden}
.hero-photo img{width:100%;height:100%;object-fit:cover;object-position:30% 55%;max-width:none;transform:scale(1.06);animation:drift 22s ease-out forwards}
@keyframes drift{to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.hero-photo img{animation:none;transform:none}}
.hero-photo::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,16,28,.78) 0%,rgba(6,16,28,.5) 34%,rgba(6,16,28,.08) 62%,rgba(6,16,28,0) 100%)}
.hero-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,16,28,.45) 0%,rgba(6,16,28,0) 22%,rgba(6,16,28,0) 55%,rgba(6,16,28,.82) 100%)}
.hero .wrap{position:relative;display:grid;gap:clamp(28px,5vw,56px);width:100%}
.hero-copy{display:grid;gap:1.15rem;max-width:40rem}
.hero h1{font-size:calc(clamp(2.8rem,7.6vw,5.6rem) * var(--hs,1));line-height:1.02;letter-spacing:-.01em;text-shadow:0 2px 30px rgba(0,0,0,.35)}
.hero .eyebrow{color:var(--hero-acc);display:flex;align-items:center;gap:.75rem}
.hero .eyebrow::before{content:"";width:2.25rem;height:1px;background:currentColor;opacity:.8}
.hero p.lead{color:rgba(247,243,236,.92);font-size:clamp(1.05rem,1.6vw,1.2rem);max-width:34rem;text-shadow:0 1px 16px rgba(0,0,0,.35)}
.hero .btn-ghost{color:var(--hero-ink);border-color:rgba(247,243,236,.55);backdrop-filter:blur(6px);background:rgba(255,255,255,.06)}
.hero .btn-primary{box-shadow:0 10px 30px rgba(217,102,26,.35)}
.hero-credit{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:clamp(76px,9vw,96px);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(247,243,236,.7);z-index:2}
.hero-actions{display:flex;gap:.75rem;flex-wrap:wrap;align-items:center}
.enquire{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) auto;gap:.75rem;align-items:end;background:rgba(8,20,34,.42);border:1px solid rgba(247,243,236,.2);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border-radius:18px;padding:1.1rem;box-shadow:0 20px 50px rgba(0,0,0,.28)}
.enquire label{display:grid;gap:.3rem;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(247,243,236,.75);min-width:0}
.enq-v{display:block;min-height:2.6rem;text-transform:none;letter-spacing:0;width:100%;min-width:0;padding:.6rem .7rem;border-radius:10px;border:1px solid rgba(247,243,236,.22);background:rgba(255,255,255,.08);color:var(--hero-ink);font:500 .95rem var(--body);color-scheme:dark}
.enquire-msg{grid-column:1/-1;font-size:.95rem}
@media (max-width:900px){.enquire{grid-template-columns:1fr 1fr}.enquire .btn{grid-column:1/-1;justify-content:center}}

/* home showcase: full uncropped photo with live water */
.hero-show{display:block;min-height:0;padding-block:clamp(36px,5vw,64px) clamp(32px,5vw,64px);background:linear-gradient(180deg,var(--hero-a) 0%,color-mix(in srgb,var(--hero-a) 86%,#2A4A6E) 55%,var(--hero-a) 100%)}
.hero-top{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(20px,4vw,56px);align-items:end}
.hero-top > *{min-width:0}
.hero-show h1{font-size:calc(clamp(2.5rem,5.4vw,4.4rem) * var(--hs,1));line-height:1.02;max-width:12ch;text-shadow:none}
.hero-side{display:grid;gap:1.25rem;padding-bottom:.4rem}
@media (max-width:860px){.hero-top{grid-template-columns:1fr}}
.show-wrap{margin-top:clamp(28px,4vw,48px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.showcase{position:relative;max-width:1400px;margin:0 auto;aspect-ratio:3/2;border-radius:22px;overflow:hidden;background:#1a2a3c;box-shadow:0 40px 90px rgba(0,0,0,.45),0 0 0 1px rgba(247,243,236,.08)}
.showcase img,.showcase video,.showcase canvas{position:absolute;inset:0;width:100%;height:100%;max-width:none;display:block}
.showcase img,.showcase video{object-fit:cover}
.showcase canvas{opacity:0;transition:opacity 1.2s ease}
.showcase canvas.on{opacity:1}
.show-cap{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;padding:2.5rem 1.25rem 1rem;background:linear-gradient(180deg,rgba(6,16,28,0),rgba(6,16,28,.55));font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(247,243,236,.9);z-index:2}
.showcase .ph-btns{top:1rem;left:1rem;bottom:auto}
@media (max-width:640px){.show-wrap{padding-left:0;padding-right:0}.showcase{border-radius:0}.show-cap{font-size:.62rem;padding:1.25rem 16px .6rem}.show-cap span+span{display:none}}
.hero-show .enquire{position:relative;z-index:3;max-width:1240px;margin:clamp(-56px,-4vw,-28px) auto 0;width:calc(100% - 2*max(16px,env(safe-area-inset-left,0px)))}
@media (max-width:640px){.hero-show .enquire{margin-top:16px}}

/* inner page hero */
.phero{background:var(--hero-a);color:var(--hero-ink);padding-block:clamp(40px,7vw,80px)}
.phero .wrap{display:grid;gap:.9rem}
.phero h1{font-size:calc(clamp(2.2rem,5.5vw,3.8rem) * var(--hs,1));max-width:20ch}
.phero .eyebrow{color:var(--hero-acc)}
.phero .lead{color:rgba(247,243,236,.82);font-size:1.08rem}
.crumb{font-size:.82rem;color:rgba(247,243,236,.65)}
.crumb a{text-decoration:none}
.crumb a:hover{text-decoration:underline}

/* split + stats */
.split{display:grid;grid-template-columns:1fr 1.1fr;gap:clamp(24px,5vw,64px);align-items:center}
.split > *{min-width:0}
@media (max-width:860px){.split{grid-template-columns:1fr}}
.stats{display:flex;gap:2rem;flex-wrap:wrap;margin-block:1.75rem}
.stat{display:grid;gap:.15rem;min-width:6rem;align-content:start}
.stat-v{font:500 1.9rem/1 var(--mono);color:var(--lagoon);font-variant-numeric:tabular-nums}
.stat-l{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.mosaic{display:grid;grid-template-columns:1.4fr 1fr;grid-template-rows:1fr 1fr;gap:.75rem;aspect-ratio:5/4;max-width:100%}
.mosaic .ph:first-child{grid-row:1/3}

/* photos */
.ph{position:relative;margin:0;border-radius:var(--r);overflow:hidden;min-height:120px;background:var(--band)}
.ph img,.ph video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none}
.ph-none{background:transparent}
.ph-lagoon{background:radial-gradient(120% 80% at 30% 70%,#43C6C9 0%,#138C97 40%,#0C4F6B 100%)}
.ph-lagoon::before{content:"";position:absolute;left:-10%;right:30%;bottom:18%;height:22%;background:#EFE6CF;border-radius:50%;opacity:.9}
.ph-lagoon::after{content:"";position:absolute;left:35%;right:-10%;bottom:28%;height:40%;background:#2E5B3A;border-radius:60% 40% 0 0}
.ph-jungle{background:radial-gradient(40% 40% at 25% 30%,#4F8E4A,transparent 70%),radial-gradient(45% 45% at 75% 60%,#3B7A3E,transparent 70%),radial-gradient(35% 35% at 50% 85%,#5DA055,transparent 70%),#1F4A28}
.ph-flower{background:radial-gradient(circle at 50% 50%,#FFD27A 0 8%,#F08A2A 9% 30%,#C9541A 31% 36%,transparent 37%),radial-gradient(circle at 50% 50%,#2E6B3A,#173D22)}
.ph-sunset{background:linear-gradient(180deg,#24395A 0%,#C4613A 55%,#F2A65A 62%,#1B4660 63%,#0D2A3D 100%)}
.ph-stone{background:linear-gradient(160deg,#B9B39F,#857F6C)}
.ph-reef{background:linear-gradient(170deg,#7FD3D3,#1A7E8C 60%,#0C3F52)}
.ph-btns{position:absolute;left:.6rem;bottom:.6rem;display:none;gap:.4rem;z-index:3;flex-wrap:wrap}
body.editing .ph-btns{display:flex}
.ph-btns button{font:600 .78rem var(--body);padding:.4rem .7rem;border-radius:999px;border:0;background:rgba(10,20,28,.85);color:#fff;cursor:pointer}

/* heritage stats */
.heritage-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:1.25rem}
.heritage-grid .stat{background:var(--surface);padding:1.4rem}
@media (max-width:560px){.heritage-grid{grid-template-columns:1fr}}
.note{display:flex;gap:.6rem;align-items:flex-start;color:var(--muted);font-size:.95rem;margin-bottom:1.5rem}
.note::before{content:"";flex:none;width:8px;height:8px;margin-top:.55rem;border-radius:50%;background:var(--kelau)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:1.5rem;display:grid;gap:.4rem}
.empty p{color:var(--muted)}

/* legend */
.legend{background:var(--hero-a);color:var(--hero-ink)}
.legend .eyebrow{color:var(--hero-acc)}
.legend-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:clamp(24px,5vw,64px)}
@media (max-width:860px){.legend-body{grid-template-columns:1fr}}
.legend .sub{font-family:var(--display);font-size:1.4rem;color:var(--hero-acc);margin-top:.5rem}
.legend p{color:rgba(247,243,236,.86);max-width:62ch}
.legend .story{display:grid;gap:1rem}
.moral{border-left:2px solid var(--hero-acc);padding-left:1rem;font-style:italic}
.legend .museum{font-size:.88rem;color:rgba(247,243,236,.65)}
.legend .btn-ghost{color:var(--hero-ink);border-color:rgba(247,243,236,.4)}

/* flag */
.flag-art{position:relative;aspect-ratio:8/5;border-radius:6px;overflow:hidden;max-width:100%;box-shadow:0 12px 40px rgba(14,34,53,.18)}
.flag-art .ph{position:absolute;inset:0;border-radius:0}
.flag-draw{position:absolute;inset:0}
.flag-draw svg{width:100%;height:100%;display:block}
.cap{font-size:.85rem;color:var(--muted);margin-top:.6rem}
.callouts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem;margin-top:1.75rem}
@media (max-width:520px){.callouts{grid-template-columns:1fr}}
.callout{border-top:2px solid var(--kelau);padding-top:.6rem;display:grid;gap:.2rem;min-width:0}
.callout b{font-weight:600}
.callout span{color:var(--muted);font-size:.93rem}

/* hamlets */
.hamlets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1rem}
@media (max-width:900px){.hamlets{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.hamlets{grid-template-columns:1fr}}
.hamlet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1.2rem;display:grid;gap:.45rem;align-content:start;min-width:0}
.hamlet-n{font:500 .85rem var(--mono);color:var(--kelau)}
.hamlet p{color:var(--muted);font-size:.95rem}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.card .ph{border-radius:0;aspect-ratio:4/3;min-height:0}
.card-body{padding:1rem 1.1rem 1.2rem;display:grid;gap:.4rem;min-width:0}
.tag{font:600 .7rem/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--jungle)}
.card-body p{color:var(--muted);font-size:.95rem}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem}
.chip{font:600 .82rem var(--body);padding:.45rem .85rem;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count{font-size:.88rem;color:var(--muted);margin-bottom:1.25rem}

/* governance + visit */
.period{font:500 .85rem var(--mono);color:var(--muted)}
.governor{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1.25rem;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1.5rem;margin-bottom:2.5rem}
.governor .ph{width:96px;height:96px;min-height:0;border-radius:50%}
.governor .role{color:var(--lagoon);font-weight:600;font-size:.92rem;margin-top:.2rem}
.governor p.bio{color:var(--muted);margin-top:.6rem;max-width:68ch}
@media (max-width:520px){.governor{grid-template-columns:1fr}}
.updates{display:grid;border-top:1px solid var(--line)}
.update{display:grid;grid-template-columns:3.5rem minmax(0,1fr) auto;gap:1rem;padding-block:1.4rem;border-bottom:1px solid var(--line);align-items:start}
.update-n{font:500 .9rem var(--mono);color:var(--kelau);padding-top:.25rem}
ul.pts{margin:.5rem 0 0;padding-left:1.1rem;color:var(--muted);display:grid;gap:.25rem}
.pts-edit{color:var(--muted);margin-top:.5rem;white-space:pre-line}
.hint{font-size:.78rem;color:var(--lagoon);margin-top:.3rem}
.visit-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1.5rem}
.visit-item{display:grid;gap:.4rem;padding-top:1rem;border-top:3px solid var(--lagoon);min-width:0;align-content:start}
.visit-item:nth-child(4n+2){border-color:var(--jungle)}
.visit-item:nth-child(4n+3){border-color:var(--kelau)}
.visit-item:nth-child(4n){border-color:var(--ink)}

/* gallery */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.75rem}
.gal{display:grid;gap:.4rem;min-width:0;align-content:start}
.gal .ph{aspect-ratio:4/3;min-height:0}
.gal-cap{font-size:.88rem;color:var(--muted)}

/* contact */
.details{display:grid;gap:0;border-top:1px solid var(--line);margin-top:1.5rem}
.detail{display:grid;grid-template-columns:8rem minmax(0,1fr) auto;gap:1rem;padding-block:.9rem;border-bottom:1px solid var(--line);align-items:baseline}
.detail b{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.detail span{word-break:break-word}
@media (max-width:520px){.detail{grid-template-columns:1fr}}
.contact-photo{aspect-ratio:4/3;max-width:100%}

/* cta + footer */
.cta{position:relative;color:#fff;overflow:hidden;background:var(--hero-a)}
.cta .bg{position:absolute;inset:0;border-radius:0;min-height:0}
.cta .bg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,27,43,.88),rgba(11,27,43,.45))}
.cta .wrap{position:relative;z-index:2}
.cta .eyebrow{color:var(--hero-acc)}
.cta h2{max-width:20ch;margin-top:.75rem}
.cta p.txt{opacity:.9;max-width:60ch;margin-block:1rem 1.5rem}
.cta .btn-ghost{color:#fff;border-color:rgba(255,255,255,.55)}
.cta .ph-btns{left:auto;right:max(16px,env(safe-area-inset-right,0px));bottom:1rem}
footer{background:var(--hero-a);color:rgba(247,243,236,.8);padding-block:3rem 2rem;font-size:.92rem}
.foot{display:grid;grid-template-columns:1.3fr 1fr 1fr 1.2fr;gap:2rem}
.foot > *{min-width:0}
@media (max-width:860px){.foot{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.foot{grid-template-columns:1fr}}
.foot h4{margin:0 0 .75rem;font:600 .75rem/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--hero-acc)}
.foot ul{list-style:none;margin:0;padding:0;display:grid;gap:.4rem}
.foot a{text-decoration:none}
.foot a:hover{text-decoration:underline}
.foot .fname{font-family:var(--display);font-size:1.4rem;color:var(--hero-ink);margin-bottom:.5rem}
.legal{border-top:1px solid rgba(247,243,236,.15);margin-top:2rem;padding-top:1.25rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;font-size:.82rem}

.flag-art,.flag-art.live{position:relative;aspect-ratio:8/5;overflow:hidden;border-radius:3px;margin-left:0;box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 24px 60px rgba(14,34,53,.22),0 6px 18px rgba(14,34,53,.12);transform-origin:0 50%;transform:perspective(1400px) rotateY(0deg)}
.flag-art::before,.flag-art.live::before{content:none!important}
.flag-art::after,.flag-art.live::after{content:none!important}
.flag-art .ph{position:absolute;inset:0;border-radius:0;background:transparent;min-height:0}
.flag-art .ph img{object-fit:contain}
.flag-art .flag-draw svg{object-fit:contain}
.flag-sheen{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden;mix-blend-mode:soft-light;opacity:.9}
.flag-sheen::before{content:"";position:absolute;top:0;bottom:0;left:0;width:200%;will-change:transform;
  background:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.5) 10%,rgba(0,0,0,.26) 22%,rgba(255,255,255,.32) 36%,rgba(0,0,0,.16) 50%,rgba(255,255,255,.28) 64%,rgba(0,0,0,.22) 78%,rgba(255,255,255,.4) 90%,rgba(255,255,255,0) 100%) 0 0/50% 100% repeat-x;
  animation:silk 12s linear infinite}
.flag-sheen::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0) 35%,rgba(0,0,0,0) 70%,rgba(0,0,0,.12))}

.flag-art + .cap,.flag-art.live + .cap{padding-left:0}
/* unfurl into view from the hoist, then breathe */
.flag-art.pre{clip-path:inset(0 100% 0 0);filter:blur(8px) brightness(.85)}
.flag-art.unfurl{clip-path:inset(0 0 0 0);filter:none;transition:clip-path 2.1s cubic-bezier(.65,0,.25,1),filter 2s ease .2s;animation:sway 9s ease-in-out 2.2s infinite alternate}

.hflag img,.hflag svg{object-fit:contain!important;opacity:1!important}
.hflag .flag-sheen{opacity:.7}.hflag .flag-sheen::before{animation-duration:9s}
@media (prefers-reduced-motion:reduce){.flag-sheen::before{animation:none}.flag-art.pre{clip-path:none;filter:none}.flag-art.unfurl{animation:none;transition:none}}

  for(var i=0;i<18;i++){var a=i*Math.PI*2/18,x1=150+Math.cos(a)*9,y1=100+Math.sin(a)*9,x2=150+Math.cos(a)*25,y2=100+Math.sin(a)*25;
    st+='<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'"/><circle cx="'+x2.toFixed(1)+'" cy="'+y2.toFixed(1)+'" r="2.1"/>'}
  for(var j=0;j<6;j++){pe+='<path transform="rotate('+(j*60+15)+' 150 100)" d="M150 100 C 128 80, 126 50, 142 44 C 147 49, 153 49, 158 44 C 174 50, 172 80, 150 100 Z"/>'}
  return '<svg viewBox="0 0 300 200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Flag of Angaur State"><rect width="300" height="50" fill="#009B57"/><rect y="50" width="300" height="50" fill="#62CD97"/><rect y="100" width="300" height="50" fill="#1577D2"/><rect y="150" width="300" height="50" fill="#001E7E"/>'+
  '<g fill="#F07A1A" stroke="#C4520F" stroke-width="1.6" stroke-linejoin="round">'+pe+'</g><circle cx="150" cy="100" r="15" fill="#F5A23A"/><circle cx="150" cy="100" r="8" fill="#FFD24D"/>'+
  '<g stroke="#111" stroke-width="1.3" fill="#111">'+st+'</g></svg>';
}

function ensureBars(){

var TK_SPEED={slow:1.6,normal:1,fast:.6};
function tickerBar(){
  ensureBars(); var T=state.ticker, items=T.items||[];
  if(editing){
    return '<section class="tkr-edit" id="home-ticker"><div class="wrap"><div class="tkr-tools"><strong>Moving news bar</strong>'+
      '<button type="button" class="mini" data-toggle="ticker.on">'+(T.on!==false?"Shown":"Hidden")+'</button>'+
      '<span class="tkr-sp">Speed:'+["slow","normal","fast"].map(function(k){return '<button type="button" class="mini'+(T.speed===k?" on":"")+'" data-tkspeed="'+k+'">'+k.charAt(0).toUpperCase()+k.slice(1)+'</button>'}).join("")+'</span></div>'+
      '<div class="tkr-list">'+items.map(function(it,i){var p="ticker.items."+i;return '<div class="tkr-row"><span class="tkr-im">'+(it.img?media(it.img,""):'<i></i>')+'</span>'+t(p+".text","span","tkr-tx")+
        '<span class="ph-btns" style="position:static"><button type="button" data-change="'+p+'.img">'+(it.img?"Change picture":"Add picture")+'</button>'+(it.img?'<button type="button" data-clear="'+p+'.img">Remove picture</button>':"")+'</span>'+rm(p)+'</div>'}).join("")+'</div>'+
      add("ticker.items","Add message")+'</div></section>';
  }
  if(T.on===false||!items.length) return "";
  var one=items.map(function(it){return '<span class="tkr-it">'+(it.img?'<span class="tkr-im">'+media(it.img,"")+'</span>':'<span class="tkr-dot" aria-hidden="true"></span>')+'<span>'+esc(it.text)+'</span></span>'}).join("");
  var reps=Math.max(2,Math.ceil(6/items.length)), half="";
  for(var r=0;r<reps;r++) half+=one;
  var dur=Math.round(items.length*reps*7*(TK_SPEED[T.speed]||1));
  return '<section class="tkr" id="home-ticker" aria-label="Announcements"><div class="tkr-track" style="--tkd:'+dur+'s"><div class="tkr-half">'+half+'</div><div class="tkr-half" aria-hidden="true">'+half+'</div></div></section>';
}

    return '<section class="band strip-edit" id="home-strip">'+head+'<div class="wrap"><div class="tkr-tools"><strong>Sliding photo bar</strong><button type="button" class="mini" data-toggle="strip.on">'+(S.on!==false?"Shown":"Hidden")+'</button></div>'+

function ensureMap(){

    text:"Explore the island: tap a place to fly to it, or switch between satellite and street view.",

      {name:"Angaur Harbor",text:"Natural harbor on the west coast",lat:6.9052,lng:134.1283},
      {name:"Angaur Airstrip",text:"Flights from Airai Airport",lat:6.9064,lng:134.1450}]};
  var M=state.map; M.pins=M.pins||[];
  return M;
}
var MAPI=null, MAPMK=[], LFL=null;
function loadLeaflet(cb){
  if(window.L&&window.L.map) return cb();
  if(LFL){LFL.push(cb);return} LFL=[cb];
  var sc=document.createElement("script"); sc.src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"; sc.async=true;
  sc.onload=function(){var q=LFL;LFL=null;q.forEach(function(f){try{f()}catch(e){}})};
  sc.onerror=function(){LFL=null;var b=app.querySelector(".map-box");if(b)b.classList.add("no-tiles")};
  document.head.appendChild(sc);
}
function mapSection(){
  var M=ensureMap(), pins=M.pins, pic=state.img.map, usePic=M.mode==="picture"&&pic;
  if(!editing&&M.on===false) return "";
  var head='<div class="sec-head">'+t("map.eyebrow","p","eyebrow")+t("map.title","h2")+t("map.text","p","lead")+'</div>';
  var gm="https://www.google.com/maps/@6.9035,134.137,15z";
  var box='<div class="map-box">'+(usePic?media(pic,"Map of Angaur","map-pic"):
      '<div class="map-el" role="region" aria-label="Interactive map of Angaur"></div>'+
      '<div class="map-views"><button type="button" class="'+(M.view!=="street"?"on":"")+'" data-mapview="satellite">Satellite</button><button type="button" class="'+(M.view==="street"?"on":"")+'" data-mapview="street">Street</button></div>'+
      '<div class="map-fall"><p>The live map can’t load in this view.<br><a href="'+gm+'" target="_blank" rel="noopener">Open Angaur in Google Maps</a></p></div>'+
      '<a class="map-open" href="'+gm+'" target="_blank" rel="noopener">Open in Google Maps ↗</a>')+'</div>';
  var list;
  if(editing){
    list='<ol class="map-list map-ed-list">'+pins.map(function(p,i){var b="map.pins."+i;return '<li data-pin="'+i+'"><span class="mn">'+(i+1)+'</span><div>'+t(b+".name","strong")+t(b+".text","small")+'</div>'+rm(b)+'</li>'}).join("")+'</ol>'+add("map.pins","Add place");
  } else {
    list='<ol class="map-list">'+pins.map(function(p,i){return '<li data-pin="'+i+'" tabindex="0"><span class="mn">'+(i+1)+'</span><div><strong>'+esc(p.name)+'</strong>'+(p.text?'<small>'+esc(p.text)+'</small>':"")+'</div></li>'}).join("")+'</ol>';
  }
  var tools=editing?'<div class="map-tools"><strong>Island map</strong><button type="button" class="mini" data-toggle="map.on">'+(M.on!==false?"Shown":"Hidden")+'</button>'+
      '<span>Show:</span><button type="button" class="mini'+(!usePic?" on":"")+'" data-mapmode="live">Live map</button><button type="button" class="mini'+(usePic?" on":"")+'" data-mapmode="picture">My map picture</button>'+
      '<button type="button" class="mini" data-change="img.map">'+(pic?"Change map picture":"Upload map picture")+'</button>'+(pic?'<button type="button" class="mini" data-clear="img.map">Remove picture</button>':"")+'</div>':"";
  var hint=editing&&!usePic?'<p class="map-hint">Drag any numbered pin on the map to move it to the exact spot. Names and descriptions are editable in the list.</p>':"";
  return '<section class="band map-sec" id="home-map"><div class="wrap">'+head+tools+'<div class="map-shell">'+box+'<div>'+list+'</div></div>'+hint+'</div></section>';
}
function initMap(){
  if(MAPI){try{MAPI.remove()}catch(e){} MAPI=null; MAPMK=[]}
  var el=app.querySelector(".map-el"); if(!el) return;
  loadLeaflet(function(){
    if(!el.isConnected||!window.L) return;
    var M=ensureMap(), L=window.L;
    var map=L.map(el,{zoomControl:true,scrollWheelZoom:false,attributionControl:true,zoomSnap:.25,minZoom:12,maxZoom:18,
      maxBounds:[[6.80,134.03],[7.01,134.25]]}).setView([6.9035,134.137],14.5);
    MAPI=map;
    var layers={
      satellite:L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:18,attribution:"Imagery &copy; Esri, Maxar, Earthstar Geographics"}),
      street:L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,subdomains:"abc",attribution:"&copy; OpenStreetMap contributors"})};
    var ok=0, bad=0, box=el.closest(".map-box");
    Object.keys(layers).forEach(function(k){layers[k].on("tileload",function(){ok++;box.classList.remove("no-tiles")}).on("tileerror",function(){bad++;if(!ok&&bad>5)box.classList.add("no-tiles")})});
    var cur=M.view==="street"?"street":"satellite"; layers[cur].addTo(map);
    map.on("click",function(){map.scrollWheelZoom.enable()}); map.on("mouseout",function(){map.scrollWheelZoom.disable()});
    function pick(i){
      MAPMK.forEach(function(m,j){var e=m.getElement();if(e)e.classList.toggle("on",j===i)});
      app.querySelectorAll(".map-list li").forEach(function(li){li.classList.toggle("on",+li.dataset.pin===i)});
    }
    M.pins.forEach(function(p,i){

  if(d.thr){ var v=+t.value, o=document.getElementById("o-"+d.thr); if(d.thr==="radius"){ TH().radius=v; if(o) o.textContent=v+"px" } else { TH()[d.thr]=v/100; if(o) o.textContent=v+"%" } applyLook(); return true }
  if(d.imr&&EDP&&EDP.path){ state.imgSize=state.imgSize||{}; var q=state.imgSize[EDP.path]=state.imgSize[EDP.path]||{}; q[d.imr]=+t.value; var oo=document.getElementById("o-"+d.imr); if(oo) oo.textContent=t.value+(d.imr==="mx"||d.imr==="my"?"px":"%"); applyLook(); return true }
  if(d.tx==="f"&&TX){ var sf=txStyle(); if(t.value) sf.f=t.value; else delete sf.f; applyLook(); return true }
  if(d.tx==="c"&&TX){ var s=txStyle(); s.c=t.value; applyLook(); return true }
  return false;
}
document.addEventListener("input", function(e){ if(editing) edpInput(e) });
document.addEventListener("change", function(e){ if(editing&&e.target&&e.target.dataset&&e.target.dataset.thf) edpInput(e) });

/* per-text style bar */
var TX=null, TXel=null;
function txStyle(){ state.styles=state.styles||{}; return state.styles[TX]=state.styles[TX]||{} }
function hideTx(){ var b=document.querySelector(".txbar"); if(b) b.remove(); TX=null; TXel=null }
function posTx(){ var b=document.querySelector(".txbar"); if(!b||!TXel||!document.body.contains(TXel)) return; var r=TXel.getBoundingClientRect(), bw=b.offsetWidth, top=r.top-b.offsetHeight-8; if(top<8) top=r.bottom+8; b.style.top=Math.round(top)+"px"; b.style.left=Math.round(Math.max(8,Math.min(r.left,innerWidth-bw-8)))+"px" }
function drawTx(){
  if(!TXel) return; var o=(state.styles||{})[TX]||{}, b=document.querySelector(".txbar");
  if(!b){ b=document.createElement("div"); b.className="txbar"; b.setAttribute("role","toolbar"); b.setAttribute("aria-label","Text style"); document.body.appendChild(b);
    b.addEventListener("mousedown",function(e){ if(e.target.tagName!=="INPUT"&&e.target.tagName!=="SELECT"&&e.target.tagName!=="OPTION") e.preventDefault() }) }
  var col=o.c||rgbHex(getComputedStyle(TXel).color);
  b.innerHTML='<input type="color" data-tx="c" value="'+col+'" aria-label="Text colour" title="Text colour"><span class="sep"></span>'+
    '<button type="button" data-tx="-" aria-label="Smaller text" title="Smaller">A&minus;</button><span class="sz">'+Math.round((+o.s||1)*100)+'%</span><button type="button" data-tx="+" aria-label="Larger text" title="Larger">A+</button>'+
    '<button type="button" data-tx="b" class="'+(o.b?"on":"")+'" aria-pressed="'+(!!o.b)+'" title="Bold"><b>B</b></button><button type="button" data-tx="a" title="Alignment">'+({center:"Centre",right:"Right",left:"Left"}[o.a]||"Align")+'</button>'+
    '<select data-tx="f" aria-label="Font" title="Font"><option value="">Font</option>'+FONTS_H.concat(FONTS_B).filter(function(f,i,a){ return f[0]&&a.findIndex(function(g){return g[0]===f[0]})===i }).map(function(f){ return '<option value="'+f[0]+'"'+(o.f===f[0]?" selected":"")+'>'+f[0]+'</option>' }).join("")+'</select><span class="sep"></span><button type="button" data-tx="x" title="Back to original style">Reset</button>';
  posTx();
}
document.addEventListener("focusin", function(e){
  if(!editing) return; var el=e.target.closest&&e.target.closest("[data-path]");
  if(!el||!app.contains(el)) return; TX=el.dataset.path; TXel=el; drawTx();
});
document.addEventListener("focusout", function(){ setTimeout(function(){ var a=document.activeElement; if(a&&a.closest&&(a.closest(".txbar")||a.closest("[data-path]"))) return; hideTx() },180) });
window.addEventListener("scroll", function(){ if(TXel) posTx() }, {passive:true});
function txClick(b){
  var a=b.dataset.tx; if(!TX) return; var s=txStyle();
  if(a==="+") s.s=Math.min(3,Math.round(((+s.s||1)+.1)*10)/10);
  if(a==="-") s.s=Math.max(.5,Math.round(((+s.s||1)-.1)*10)/10);
  if(a==="b") s.b=!s.b;
  if(a==="a"){ var seq=["","left","center","right"]; s.a=seq[(seq.indexOf(s.a||"")+1)%4]; if(!s.a) delete s.a }
  if(a==="x") delete state.styles[TX];
  else if(s.s===1) delete s.s;
  applyLook(); drawTx();
}

var lastPage=null;
var RENDER={home:pHome,discover:pDiscover,heritage:pHeritage,sites:pSites,governance:pGovernance,visit:pVisit,news:pNews,gallery:pGallery,contact:pContact};

function editUI(){
  if(!artifactNS || readOnly) return "";
  if(!editing) return '<button type="button" class="btn btn-primary fab" id="ed-start">Edit page</button>';
  return '<div class="editbar"><div class="wrap"><p class="msg">Editing. Tap any text to change words, colour or size. Use <b>Design</b> for page colours, background and fonts, and <b>Resize</b> on any photo. Save once when done.</p>'+
  '<label for="ed-page" class="sr" style="position:absolute;left:-9999px">Page</label><select id="ed-page" class="ed-pages">'+PAGES.concat([["visit","Plan Your Visit"]]).map(function(p){return '<option value="'+p[0]+'"'+(page===p[0]?" selected":"")+'>'+esc(navLabel(p[0]))+'</option>'}).join("")+'</select>'+
  '<button type="button" class="btn btn-ghost" id="ed-design" aria-pressed="'+(!!(EDP&&EDP.mode==="design"))+'">Design</button><button type="button" class="btn btn-ghost" id="ed-cancel">Cancel</button><button type="button" class="btn btn-primary" id="ed-save"'+(saving?" disabled":"")+'>'+(saving?"Saving…":"Save changes")+'</button></div></div>';
}

/* ---------- sound of the sea: waves rolling onto the beach (synthesised live, no audio file) ---------- */


function render(){
  hideTx();
  var entering=page!==lastPage;
  app.innerHTML = header()+'<main'+(page!==lastPage?' class="pg-in"':'')+'>'+RENDER[page]()+cta()+'</main>'+footer()+editUI(); lastPage=page;
  document.body.classList.toggle("editing", editing);
  if(editing){
    app.querySelectorAll("[data-path]").forEach(function(el){
      el.setAttribute("contenteditable","plaintext-only");
      if(el.contentEditable!=="plaintext-only") el.setAttribute("contenteditable","true");
    });
  }
  applyLook();
  if(EDP&&editing) drawEdp(); else if(EDP) closeEdp();
  if(page==="home"&&!editing&&!wlBooted) playWelcome(false);
  wlBooted=true;
  var wlEl=document.getElementById("welcome");
  if(wlEl&&!wlEl.classList.contains("out")) wlGL=true; else { initWater(); initFlags(); initSeas(); }
  initMap();
  initReveal();
  initFlagFx();
  if(page==="home"&&!editing&&entering&&!wlEl) heroIn();
}

var goT=0;
function go(p){
  if(!RENDER[p]) p="home";
  if(editing) collect();
  var m=app.querySelector("main"), reduce=false; try{ reduce=matchMedia("(prefers-reduced-motion: reduce)").matches }catch(_){}
  function swap(){ goT=0; page=p; render(); window.scrollTo(0,0); try{ if(location.hash!=="#"+p) history.replaceState(null,"","#"+p) }catch(_){} }
  if(goT){ clearTimeout(goT); goT=0 }
  if(m&&!editing&&!reduce&&p!==page){ m.classList.add("pg-out"); goT=setTimeout(swap,300) } else swap();
}

function collect(){
  app.querySelectorAll("[data-path]").forEach(function(el){
    var v=el.innerText.replace(/\u00a0/g," ").replace(/\n{3,}/g,"\n\n").trim(), cur=get(el.dataset.path);
    if(v===String(cur==null?"":cur).trim()) return;
    set(el.dataset.path, v);
  });
}

function toast(msg){
  var old=document.querySelector(".toast"); if(old) old.remove();
  var d=document.createElement("div"); d.className="toast"; d.setAttribute("role","status"); d.textContent=msg;
  document.body.appendChild(d); setTimeout(function(){d.remove()},4200);
}

function buildDoc(){
  var data = JSON.stringify(state).replace(/</g,"\\u003c");
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+
    "<title>"+esc(TITLE)+"</title>\n"+'<meta name="claude:viewport-fit-sides" content="cover">\n'+FONTS+"\n"+
    '<style id="site-css">'+CSS+"</style>\n\n"+'<div id="app"></div>\n\n'+
    '<script type="application/json" id="site-data">'+data+"<\/script>\n\n"+
    '<script id="site-js">'+JS+"<\/script>\n</body></html>";
}

async function save(){
  if(saving) return;
  collect(); saving=true; render();
  try{ sessionStorage.setItem("angaur-page", page) }catch(_){}
  try{
    await artifactNS.publish(buildDoc());
    toast("Saved. Loading the new version…");
  }catch(e){
    saving=false;
    var c=e&&e.code;
    if(c==="conflict"){toast("Someone else saved a newer version. Loading it now.");return}
    if(c==="not_writer"||c==="not_granted"||c==="consent_required"||c==="capability_disabled"||c==="capability_removed"||c==="not_declared"){readOnly=true;editing=false;render();toast("This page is view-only for you, so changes can't be saved.");return}
    if(c==="rate_limited"){render();toast("Too many saves in a row. Wait a minute, then save again.");return}
    if(c==="too_large"){render();toast("The page is too large to save. Remove a photo or two and try again.");return}
    render(); toast("Saving didn't go through. Check your connection and press Save again.");
  }
}

var fileInput=document.createElement("input");
fileInput.type="file"; fileInput.accept="image/*,video/*"; fileInput.hidden=true; fileInput.id="photo-input";
document.body.appendChild(fileInput);
var pendingPath=null;
fileInput.addEventListener("change", async function(){
  var f=fileInput.files&&fileInput.files[0]; fileInput.value="";
  if(!f||!pendingPath) return;
  if(!assetsNS){toast("Photo uploads aren't available in this view.");return}
  collect(); toast("Uploading photo…");
  var vid=/^video\//.test(f.type||"");
  try{ var r=await assetsNS.upload(f); set(pendingPath, (vid?"video:":"")+r.url); if(pendingPath==="img.hero") state.img.heroWater=false; render(); toast((vid?"Video":"Photo")+" added. Press Save changes to keep it."); }
  catch(e){ toast(e&&e.code==="too_large"?"That file is too large (20 MB max). Try a shorter or smaller video.":"The file couldn't be uploaded. Try a JPG, PNG or MP4."); }
});

document.addEventListener("click", function(e){
  var el=e.target;
  if(bkClick(e)) return;
  if(editing){
    var zb=el.closest("[data-isz]"); if(zb){ e.preventDefault(); collect(); EDP={mode:"img",path:zb.dataset.isz}; drawEdp(); return }
    var tb=el.closest("[data-tx]"); if(tb&&tb.tagName==="BUTTON"){ e.preventDefault(); txClick(tb); return }
    var pb=el.closest("#ed-panel button"); if(pb){
      if(pb.dataset.edp==="close"){ closeEdp(); return }
      if(pb.dataset.wlt){ W().on=W().on===false; drawEdp(); return }
      if(pb.dataset.wlp){ collect(); playWelcome(true); return }
      if(pb.dataset.edp==="reset"){ if(EDP.mode==="design") state.theme={}; else if(state.imgSize) delete state.imgSize[EDP.path]; applyLook(); drawEdp(); return }
      if(pb.dataset.shape!=null&&EDP.mode==="img"){ state.imgSize=state.imgSize||{}; var qq=state.imgSize[EDP.path]=state.imgSize[EDP.path]||{}; if(pb.dataset.shape) qq.r=pb.dataset.shape; else delete qq.r; applyLook(); drawEdp(); return }
      if(pb.dataset.preset){ var pr=TH_PRESETS[pb.dataset.preset], th=TH(); TH_KEYS.forEach(function(k){ if(pr) th[k[0]]=pr[k[0]]; else delete th[k[0]] }); applyLook(); drawEdp(); return }
      return }
  }
  var r=el.closest("[data-route]");
  if(r && !(editing && el.closest("[data-path]"))){ e.preventDefault(); go(r.dataset.route); return }
  if(editing && el.closest("a")){ e.preventDefault(); }
  var b=el.closest("button"); if(!b) return;
  if(b.dataset.filter){ poiFilter=b.dataset.filter; render(); return }
  if(b.dataset.nfilter){ newsFilter=b.dataset.nfilter; render(); return }
  if(b.id==="ed-start"){ snapshot=JSON.stringify(state); editing=true; render(); toast("Editing is on."); return }
  if(b.id==="ed-cancel"){ closeEdp(); state=JSON.parse(snapshot); editing=false; render(); return }
  if(b.id==="ed-save"){ closeEdp(); save(); return }
  if(b.id==="ed-design"){ collect(); if(EDP&&EDP.mode==="design") closeEdp(); else { EDP={mode:"design"}; drawEdp() } var db=document.getElementById("ed-design"); if(db) db.setAttribute("aria-pressed",String(!!EDP)); return }
  if(b.dataset.bkpos){ collect(); ensureBars(); state.layout.bookPos=b.dataset.bkpos; render(); return }
  if(b.dataset.mapmode){ collect(); ensureMap().mode=b.dataset.mapmode; if(b.dataset.mapmode==="picture"&&!state.img.map) toast("Upload a map picture to show it here."); render(); return }
  if(b.dataset.mapview) return;
  if(b.dataset.tkspeed){ collect(); ensureBars(); state.ticker.speed=b.dataset.tkspeed; render(); return }
  if(b.dataset.add==="news.items"){ collect(); NW().items.push({date:bkS(new Date()),cat:"News",title:"New post",when:"",text:"Write the details here.",img:null}); render(); toast("New post added first in the list. Change it, then press Save changes."); return }
  if(b.dataset.add){ collect(); get(b.dataset.add).push(JSON.parse(JSON.stringify(TEMPLATES[b.dataset.add]))); render(); return }
  if(b.dataset.remove){ collect(); var p=b.dataset.remove.split("."), idx=+p.pop(); get(p.join(".")).splice(idx,1); render(); return }
  if(b.dataset.toggle){ collect(); var tv=get(b.dataset.toggle); set(b.dataset.toggle, tv===false); render(); return }
  if(b.dataset.change){ if(!assetsNS){toast("Photo uploads aren't available in this view.");return} pendingPath=b.dataset.change; fileInput.click(); return }
  if(b.dataset.clear){ collect(); set(b.dataset.clear,null); render(); return }
});

document.addEventListener("paste", function(e){
  if(!editing||!e.target.closest||!e.target.closest("[data-path]")) return;
  e.preventDefault(); var txt=(e.clipboardData||window.clipboardData).getData("text/plain");
  document.execCommand("insertText", false, txt);
});

document.addEventListener("submit", function(e){
  if(e.target.id!=="enquire-form") return;
  e.preventDefault(); var m=document.getElementById("enq-msg"); if(m) m.hidden=false;
});

document.addEventListener("change", function(e){ if(e.target&&e.target.id==="ed-page") go(e.target.value) });
document.addEventListener("change", function(e){ var d=e.target&&e.target.dataset; if(editing&&d&&d.date){ collect(); set(d.date,e.target.value); render() } });
window.addEventListener("hashchange", function(){ var h=location.hash.slice(1); if(h&&h!==page&&RENDER[h]) go(h) });

(function(){
  var h=location.hash.slice(1), saved=null;
  try{ saved=sessionStorage.getItem("angaur-page"); sessionStorage.removeItem("angaur-page") }catch(_){}
  page = RENDER[h] ? h : (RENDER[saved] ? saved : "home");
  render();
})();

(async function(){
  if(!window.claude||!window.claude.use) return;
  try{
    var res=await Promise.all([claude.use("artifact"),claude.use("assets"),claude.use("user")]);
    var u=res[2], can=null;
    if(u&&u.canEdit){ try{ can=await u.canEdit(); }catch(_){ can=null } }
    if(can===false) return;
    artifactNS=res[0]; assetsNS=res[1];
    if(artifactNS && !editing) render();
  }catch(_){}
})();
})();
</script>
