*{box-sizing:border-box}

/* ---------- live water on the home photo ---------- */
var water={raf:0,canvas:null,io:null,ro:null,visible:true};
function stopWater(){ if(water.raf) cancelAnimationFrame(water.raf); water.raf=0; if(water.io) water.io.disconnect(); if(water.ro) water.ro.disconnect(); water.io=water.ro=null; water.canvas=null; }
var VS="attribute vec2 a;varying vec2 v;void main(){v=vec2(a.x*.5+.5,.5-a.y*.5);gl_Position=vec4(a,0.,1.);}";
var FS=[
"precision highp float;uniform sampler2D u_img;uniform float u_t;varying vec2 v;",
"float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}",
"float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1.,0.)),f.x),mix(h(i+vec2(0.,1.)),h(i+vec2(1.,1.)),f.x),f.y);}",
"float shore(float y){return .15+(y-.70)*.73;}",
"float wm(vec2 uv){",
" float top=mix(.566,.612,smoothstep(.405,.385,uv.x));",
" top=mix(top,.695,smoothstep(.205,.185,uv.x));",
" float m=smoothstep(top,top+.01,uv.y);",
" float e=shore(uv.y);",
" m*=smoothstep(e,e+.025,uv.x);",
" return m;}",
"void main(){",
" vec2 uv=v;float t=u_t;",
" float m=wm(uv);",
" float d=clamp((uv.y-.56)/.44,0.,1.);",
" float amp=(.0005+.0034*d*d)*m;",
" float fq=mix(170.,36.,d);",
" float w1=sin(uv.y*fq+t*1.5+n(uv*vec2(5.,28.)+t*.12)*6.2832);",
" float w2=sin(uv.y*fq*1.73-t*1.05+uv.x*14.+n(uv*vec2(9.,40.)-t*.1)*3.);",
" vec2 off=vec2(.35*w2,w1)*amp;",
" float sky=smoothstep(.43,.48,uv.x)*(1.-smoothstep(.5,.552,uv.y));",
" off+=vec2(n(uv*vec2(3.,5.)+vec2(t*.03,0.))-.5,n(uv*vec2(4.,3.)-vec2(0.,t*.02))-.5)*.0045*sky;",
" vec4 c=texture2D(u_img,clamp(uv+off,0.,1.));",
" c.rgb*=1.+.035*w1*m*d;",
" float sun=exp(-pow((uv.x-.93)/.085,2.))*smoothstep(.565,.6,uv.y)*(1.-smoothstep(.62,.98,uv.y));",
" float g=pow(n(vec2(uv.x*230.,uv.y*950.-t*2.2)),16.);",
" c.rgb+=g*sun*m*vec3(1.,.88,.62)*1.4;",
" float g2=pow(n(vec2(uv.x*420.+t*.35,uv.y*1500.-t*3.)),24.)*m*d;",
" c.rgb+=g2*vec3(1.,.97,.9)*.55;",
" float e=shore(uv.y);",
" float lap=.006+.006*sin(t*.9+uv.y*30.);",
" float foam=(1.-smoothstep(0.,.006,abs(uv.x-e-lap)))*smoothstep(.69,.73,uv.y);",
" foam*=.55+.45*n(vec2(uv.y*120.,t*.6));",
" c.rgb=mix(c.rgb,vec3(1.,.98,.95),foam*.32);",
" gl_FragColor=vec4(c.rgb,1.);}"
].join("\n");
function initWater(){
var c=app.querySelector("canvas.water");
if(!c){ stopWater(); return }
if(c===water.canvas) return;
stopWater(); water.canvas=c;
var img=app.querySelector(".show-img"), box=c.parentNode;
function fit(){ if(img.naturalWidth) box.style.aspectRatio=img.naturalWidth+" / "+img.naturalHeight }
var reduce=false; try{ reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches }catch(_){}
function start(){
fit(); if(reduce || water.canvas!==c) return;
var gl=null; try{ gl=c.getContext("webgl",{antialias:false,premultipliedAlpha:false,preserveDrawingBuffer:false}) }catch(_){}
if(!gl) return;
function sh(type,src){var o=gl.createShader(type);gl.shaderSource(o,src);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(o));return o}
var pr;
try{
pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);
if(!gl.getProgramParameter(pr,gl.LINK_STATUS)) throw new Error("link");
gl.useProgram(pr);
var b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
var loc=gl.getAttribLocation(pr,"a");gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
var tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);
}catch(err){ return }
var ut=gl.getUniformLocation(pr,"u_t");
function size(){ var dpr=Math.min(window.devicePixelRatio||1,2); var w=Math.round(c.clientWidth*dpr), hh=Math.round(c.clientHeight*dpr); if(w>2400){hh=Math.round(hh*2400/w);w=2400} if(w&&hh&&(c.width!==w||c.height!==hh)){c.width=w;c.height=hh;gl.viewport(0,0,w,hh)} }
size();
if(window.ResizeObserver){ water.ro=new ResizeObserver(size); water.ro.observe(c) }
if(window.IntersectionObserver){ water.io=new IntersectionObserver(function(es){ water.visible=es[0].isIntersecting }); water.io.observe(c) }
var t0=performance.now(), shown=false;
function frame(now){
if(water.canvas!==c) return;
water.raf=requestAnimationFrame(frame);
if(!water.visible||document.hidden) return;
gl.uniform1f(ut,(now-t0)/1000);
gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
if(!shown){ shown=true; c.classList.add("on") }
}
water.raf=requestAnimationFrame(frame);
}
if(img.complete&&img.naturalWidth) start(); else img.addEventListener("load",start,{once:true});
}

function render(){

app.querySelectorAll("[data-path]").forEach(function(el){
el.setAttribute("contenteditable","plaintext-only");
if(el.contentEditable!=="plaintext-only") el.setAttribute("contenteditable","true");
});

function go(p){

if(editing) collect();
page=p; render(); window.scrollTo(0,0);
try{ if(location.hash!=="#"+p) history.replaceState(null,"","#"+p) }catch(_){}

function collect(){
app.querySelectorAll("[data-path]").forEach(function(el){
var v=el.innerText.replace(/\u00a0/g," ").replace(/\n{3,}/g,"\n\n").trim(), cur=get(el.dataset.path);
if(v===String(cur==null?"":cur).trim()) return;
set(el.dataset.path, v);
});
}
